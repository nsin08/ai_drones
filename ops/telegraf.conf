# Telegraf Configuration for Drone Fleet Telemetry

[agent]
  interval = "1s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "1s"
  flush_jitter = "0s"

###############################################################################
#                            INPUT PLUGINS                                     #
###############################################################################

# Subscribe to MQTT topics and parse drone telemetry
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = [
    "fleet/+/telemetry",
    "fleet/+/mission",
    "fleet/+/faults"
  ]
  data_format = "json"
  tag_keys = ["drone_id", "mission_type", "mission_role"]
  json_string_fields = ["mode", "mission_status"]

###############################################################################
#                            OUTPUT PLUGINS                                    #
###############################################################################

# Write to InfluxDB 2.x
[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "drone_fleet"
  bucket = "telemetry"
  
  [outputs.influxdb_v2.tagpass]
    # Only write telemetry with drone_id tag
    drone_id = ["*"]
