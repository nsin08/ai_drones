# Hardware-Only Mode: Real ArduPilot Drones → MQTT → Mission Control UI
# Usage: docker compose -f docker-compose.hardware.yml up
#
# Includes minimal stack:
#  - mosquitto: MQTT broker (required)
#  - mission-control: Backend UI server (required)
#
# Optional monitoring stack (uncomment if needed):
#  - influxdb: Time-series metrics (optional)
#  - grafana: Dashboard visualization (optional)
#  - telegraf: Metrics forwarding (optional if using influxdb)

services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: mosquitto-broker
    ports:
      - "1883:1883"    # Standard MQTT port — used by drone_gateway.py + mission-control
      - "9001:9001"    # WebSocket port (optional)
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_logs:/mosquitto/log
    environment:
      TZ: UTC
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-h", "localhost", "-t", "$$SYS/broker/uptime", "-C", "1", "-W", "3"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - fleet-network

  mission-control:
    build:
      context: ..
      dockerfile: poc/Dockerfile
    container_name: mission-control
    ports:
      - "5000:5000"    # React UI
    environment:
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - INVENTORY_URL=http://localhost:8001  # Mock if inventory not running
    depends_on:
      mosquitto:
        condition: service_healthy
    networks:
      - fleet-network

