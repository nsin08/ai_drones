services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: mosquitto-broker
    ports:
      - "1883:1883"    # Standard MQTT port
      - "9001:9001"    # WebSocket port (optional)
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_logs:/mosquitto/log
    environment:
      TZ: UTC
    healthcheck:
      # NOTE: Use $$ to avoid Compose env-var interpolation of $SYS.
      # -C 1: exit after one message; -W: timeout for receiving a message.
      test: ["CMD", "mosquitto_sub", "-h", "localhost", "-t", "$$SYS/broker/uptime", "-C", "1", "-W", "3"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - fleet-network

  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=adminpass123
      - DOCKER_INFLUXDB_INIT_ORG=drone_fleet
      - DOCKER_INFLUXDB_INIT_BUCKET=telemetry
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=my-super-secret-auth-token
    networks:
      - fleet-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana:10.2.3
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-worldmap-panel
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    depends_on:
      - influxdb
    networks:
      - fleet-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  telegraf:
    image: telegraf:1.29
    container_name: telegraf
    volumes:
      - ./telegraf.conf:/etc/telegraf/telegraf.conf:ro
    depends_on:
      - mosquitto
      - influxdb
    networks:
      - fleet-network
    environment:
      - INFLUX_TOKEN=my-super-secret-auth-token

  inventory:
    build:
      context: ../inventory
    container_name: drone-inventory
    ports:
      - "8001:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - DRONE_LABEL=com.ai_drones.kind=drone
      - MAVLINK_DIALECT=ardupilotmega
      - MAVLINK_ENDPOINT_TEMPLATE=tcp:{ip}:5760
    depends_on:
      - mosquitto
    networks:
      - fleet-network

  mission-control:
    build:
      context: ..
      dockerfile: poc/Dockerfile
    container_name: mission-control
    ports:
      - "5000:5000"
    environment:
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - INVENTORY_URL=http://inventory:8000
    depends_on:
      - mosquitto
      - inventory
    networks:
      - fleet-network

  swarmsim:
    build:
      context: ../swarmsim
    container_name: swarmsim
    environment:
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - SIM_FAIL_RATE=0.02
    depends_on:
      mosquitto:
        condition: service_healthy
    networks:
      - fleet-network
    restart: unless-stopped

  drone:
    image: radarku/ardupilot-sitl
    labels:
      - com.ai_drones.kind=drone
    expose:
      - "5760"
    networks:
      - fleet-network

volumes:
  mosquitto_data:
  mosquitto_logs:
  influxdb_data:
  influxdb_config:
  grafana_data:

networks:
  fleet-network:
    driver: bridge
